version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: boker-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/backend/data
    volumes:
      # 持久化数据库文件
      - ./data:/app/backend/data
      # 持久化上传文件
      - ./uploads:/app/backend/uploads
    networks:
      - app-network
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: boker-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  data:
  uploads:
